<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160"><rect width="1100" height="1160" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#244e75"/></marker></defs><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#162d43">Метод Куттера–Джордана–Боссена</text><text x="270" y="100" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Встраивание</text><text x="830" y="100" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Извлечение</text><rect x="45" y="135" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="174" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">RGB-контейнер, сообщение, ключ</text><text x="270" y="204" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Параметры q, n, c</text><rect x="605" y="135" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="174" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Заполненный PNG, ключ</text><text x="830" y="204" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Длина сообщения, n, c</text><path d="M270 243 V282" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 243 V282" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="290" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="329" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Сообщение → биты</text><text x="270" y="359" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Добавить опорные биты 0 и 1</text><rect x="605" y="290" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="329" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Воспроизвести позиции</text><text x="830" y="359" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Исходная картинка не нужна</text><path d="M270 398 V437" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 398 V437" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="445" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="484" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Проверить ёмкость</text><text x="270" y="514" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Выбрать разные позиции по ключу</text><rect x="605" y="445" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="484" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Оценить B по 4c соседям</text><text x="830" y="514" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">δ = B* − среднее соседей</text><path d="M270 553 V592" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 553 V592" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="600" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="639" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">В каждой позиции вычислить Y</text><text x="270" y="669" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">B* = clip(round(B + (2b − 1)qY))</text><rect x="605" y="600" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="639" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Усреднить δ по n копиям</text><text x="830" y="669" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Вычислить порог по битам 0 и 1</text><path d="M270 708 V747" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 708 V747" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="755" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="794" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Сохранить заполненный PNG</text><text x="270" y="824" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">R и G остаются прежними</text><rect x="605" y="755" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="794" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Средняя δ больше порога?</text><text x="830" y="824" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Да: 1. Нет: 0. Убрать опорные биты</text><path d="M270 863 V902" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 863 V902" stroke="#244e75" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="910" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="270" y="949" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Сравнить с исходным</text><text x="270" y="979" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">MSE, PSNR, разница, статистика</text><rect x="605" y="910" width="450" height="108" rx="8" fill="#f0f5fa" stroke="#244e75" stroke-width="2"/><text x="830" y="949" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">Собрать сообщение</text><text x="830" y="979" text-anchor="middle" font-family="Arial" font-size="22" fill="#162d43">В опыте сравнить с оригиналом → BER</text><text x="550" y="1090" text-anchor="middle" font-family="Arial" font-size="24" fill="#162d43">Y = 0,299R + 0,587G + 0,114B</text><text x="550" y="1130" text-anchor="middle" font-family="Arial" font-size="19" fill="#162d43">В этой реализации: фиксированное число повторов; без геометрической синхронизации</text></svg>